# Theme global du dashboard (lu automatiquement par Streamlit au demarrage).
# Direction "console de supervision telecom" : bleu nuit + bleu TT, fond clair.
[theme]
primaryColor = "#0072BC"            # bleu Tunisie Telecom (accents, onglet actif, boutons)
backgroundColor = "#F8FAFC"         # fond general (blanc bleute - style dashboard BI)
secondaryBackgroundColor = "#FFFFFF" # fond des cartes et de la barre laterale
textColor = "#1E293B"               # encre (bleu ardoise fonce)
font = "sans serif"

[server]
headless = true