name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt est le fichier que Streamlit Community Cloud installe
      # au deploiement : l'installer ici verifie aussi qu'il reste resoluble.
      - run: pip install -r requirements.txt pytest

      - run: pytest -v
